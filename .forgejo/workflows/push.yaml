on: [push]
jobs:
  test:
    runs-on: ubuntu-go-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Test for tidy, fmt, vet
        run: |
          go mod tidy -diff
          gofmt -l .
          go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
      - name: Unit Tests
        run: CGO_ENABLED=0 go test ./...
