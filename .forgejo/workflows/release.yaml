on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-go-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: CGO_ENABLED=0 go test ./...

  build:
    needs: test
    runs-on: ubuntu-go-latest
    env:
      # Keep in sync with SYFT_VERSION in the Makefile.
      SYFT_VERSION: v1.49.0
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            upx: true
            tarxz: false
            ext: ''
          - goos: linux
            goarch: arm64
            upx: true
            tarxz: false
            ext: ''
          - goos: darwin
            goarch: arm64
            upx: false
            tarxz: true
            ext: ''
          - goos: windows
            goarch: amd64
            upx: true
            tarxz: false
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          out="disco-${version}-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build \
            -ldflags "-w -s -X codeberg.org/icearp/disco/cmd.Version=${version}" \
            -trimpath -o "$out" .
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"
          # SBOM_BASE tracks the RAW binary name; ARTIFACT is later rewritten to
          # the .tar.xz name by the XZ step, but the SBOM describes the binary.
          echo "SBOM_BASE=$out" >> "$GITHUB_ENV"

      - name: Generate SBOM
        # Run on the RAW binary, before the upx/xz steps below, so the SBOM
        # derives straight from the Go build rather than relying on syft seeing
        # through compression. Emits CycloneDX + SPDX sidecars keyed off the raw
        # binary name.
        run: |
          set -euo pipefail
          go run github.com/anchore/syft/cmd/syft@"${SYFT_VERSION}" scan "$SBOM_BASE" \
            -o cyclonedx-json@1.7="${SBOM_BASE}.cdx.json" \
            -o spdx-json@2.3="${SBOM_BASE}.spdx.json"

      - name: UPX compress
        if: ${{ matrix.upx }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends upx-ucl
          upx --best --lzma "$ARTIFACT"

      - name: XZ compress
        if: ${{ matrix.tarxz }}
        run: |
          set -euo pipefail
          tar -cJf "$ARTIFACT.tar.xz" "$ARTIFACT"
          rm -f "$ARTIFACT"
          echo "ARTIFACT=$ARTIFACT.tar.xz" >> "$GITHUB_ENV"

      - name: SHA256 sidecar
        run: sha256sum "$ARTIFACT" | awk '{print $1}' > "${ARTIFACT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
            ${{ env.SBOM_BASE }}.cdx.json
            ${{ env.SBOM_BASE }}.spdx.json

  release:
    needs: build
    runs-on: ubuntu-go-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: dist-tmp

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find dist-tmp -type f -exec cp -t dist {} +

      - name: Generate release notes
        run: |
          set -euo pipefail
          prev=$(git tag --sort=-creatordate | grep -vxF "${VERSION}" | head -n1 || true)
          {
            if [ -n "$prev" ]; then
              echo "Changes since ${prev}:"
              echo
              git log --pretty='* %s (%h)' "${prev}..${VERSION}"
            else
              echo "Initial release."
              echo
              git log --pretty='* %s (%h)' "${VERSION}"
            fi
          } > release-notes.md

      - name: Publish draft release
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          url: https://codeberg.org
          repo: ${{ github.repository }}
          tag: ${{ env.VERSION }}
          release-dir: dist
          release-notes-file: release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          override: true
          prerelease: false
          draft: true
