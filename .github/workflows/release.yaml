on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Keep in sync with GOVULNCHECK_VERSION in the Makefile.
      GOVULNCHECK_VERSION: v1.6.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: CGO_ENABLED=0 go test ./...
      - name: Vulnerability scan
        # Binary-mode symbol reachability against the SAME build config disco
        # ships (grpcnotrace tag, CGO off). Source mode is not usable here:
        # whole-program SSA over disco's ~496-module graph (three full cloud
        # SDKs) needs >23GB and OOMs. Build WITHOUT -w -s — `-s` strips the
        # symbol table (see the guard below for why that matters).
        # Live vuln DB (vuln.go.dev). Non-zero exit on a REACHABLE vuln fails
        # the job and blocks the draft release.
        run: |
          set -euo pipefail
          # No -w -s here, unlike the release build in the `build` job.
          CGO_ENABLED=0 go build -tags grpcnotrace -o vulnscan-target .
          # Assert the symbol table survived. A stripped binary does NOT make
          # govulncheck fail loudly — it falls back to module-granularity and
          # reports whole modules as reachable (still under a "Symbol Results"
          # header), turning the gate into a spurious-red generator. Fail here
          # with a legible reason instead.
          go tool nm vulnscan-target >/dev/null 2>&1 || {
            echo "vulnscan-target has no symbol table — did -s/-w reach this build?" >&2
            exit 1
          }
          go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" \
            -mode binary vulnscan-target

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Keep in sync with SYFT_VERSION in the Makefile.
      SYFT_VERSION: v1.49.0
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            upx: true
            tarxz: false
            ext: ''
          - goos: linux
            goarch: arm64
            upx: true
            tarxz: false
            ext: ''
          - goos: darwin
            goarch: arm64
            upx: false
            tarxz: true
            ext: ''
          - goos: windows
            goarch: amd64
            upx: true
            tarxz: false
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          out="disco-${version}-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build \
            -ldflags "-w -s -X github.com/icearp/disco-cli/cmd.Version=${version}" \
            -trimpath -o "$out" .
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"
          # SBOM_BASE tracks the RAW binary name; ARTIFACT is later rewritten to
          # the .tar.xz name by the XZ step, but the SBOM describes the binary.
          echo "SBOM_BASE=$out" >> "$GITHUB_ENV"

      - name: Generate SBOM
        # Run on the RAW binary, before the upx/xz steps below, so the SBOM
        # derives straight from the Go build rather than relying on syft seeing
        # through compression. Emits CycloneDX + SPDX sidecars keyed off the raw
        # binary name.
        run: |
          set -euo pipefail
          go run github.com/anchore/syft/cmd/syft@"${SYFT_VERSION}" scan "$SBOM_BASE" \
            -o cyclonedx-json@1.7="${SBOM_BASE}.cdx.json" \
            -o spdx-json@2.3="${SBOM_BASE}.spdx.json"

      - name: UPX compress
        if: ${{ matrix.upx }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends upx-ucl
          upx --best --lzma "$ARTIFACT"

      - name: XZ compress
        if: ${{ matrix.tarxz }}
        run: |
          set -euo pipefail
          tar -cJf "$ARTIFACT.tar.xz" "$ARTIFACT"
          rm -f "$ARTIFACT"
          echo "ARTIFACT=$ARTIFACT.tar.xz" >> "$GITHUB_ENV"

      - name: SHA256 sidecar
        run: sha256sum "$ARTIFACT" | awk '{print $1}' > "${ARTIFACT}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          # upload-artifact@v4 requires unique names across the matrix — key on
          # the target, not $ARTIFACT (rewritten to the .tar.xz name for darwin).
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
            ${{ env.SBOM_BASE }}.cdx.json
            ${{ env.SBOM_BASE }}.spdx.json

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-tmp
          pattern: dist-*
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find dist-tmp -type f -exec cp -t dist {} +

      - name: Generate release notes
        run: |
          set -euo pipefail
          prev=$(git tag --sort=-creatordate | grep -vxF "${VERSION}" | head -n1 || true)
          {
            if [ -n "$prev" ]; then
              echo "Changes since ${prev}:"
              echo
              git log --pretty='* %s (%h)' "${prev}..${VERSION}"
            else
              echo "Initial release."
              echo
              git log --pretty='* %s (%h)' "${VERSION}"
            fi
          } > release-notes.md

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
          body_path: release-notes.md
          draft: true
          prerelease: false
