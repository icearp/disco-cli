version: 1
rules:
  - id: aws-iam-stale-access-key
    description: Active IAM access key created in 2023 or earlier — rotate
    severity: high
    match:
      provider: aws
      type: aws:iam:access-key
      where:
        - path: "Status"
          op: eq
          value: "Active"
        - path: "CreateDate"
          op: matches
          value: "^(19|20[0-1]|202[0-3])"
