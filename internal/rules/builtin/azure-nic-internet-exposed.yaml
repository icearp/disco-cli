version: 1
rules:
  - id: azure-nic-internet-exposed
    description: NIC carries a public IP and is attached to an NSG with an inbound Allow rule from any source
    severity: high
    category: Networking
    tags:
      custom: ["network-exposure"]
      nist-800-53: ["AC-3", "SC-7(2)"]
    remediation: Constrain the NSG inbound rule's sourceAddressPrefix, or remove the public IP from the NIC.
    ref_url: https://learn.microsoft.com/azure/virtual-network/network-security-groups-overview
    match:
      provider: azure
      type: azure:microsoft.network:network-interface
      where:
        - path: "properties.ipConfigurations.#.properties.publicIPAddress.id"
          op: exists
      related:
        direction: out
        kinds: [uses]
        target:
          type: azure:microsoft.network:network-security-group
          where:
            - path: "properties.securityRules.#.properties.sourceAddressPrefix"
              op: contains
              value: "*"
            - path: "properties.securityRules.#.properties.access"
              op: eq
              value: "Allow"
            - path: "properties.securityRules.#.properties.direction"
              op: eq
              value: "Inbound"
