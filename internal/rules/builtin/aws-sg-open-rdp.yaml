version: 1
rules:
  - id: aws-sg-open-rdp
    description: Security group allows RDP (port 3389) from 0.0.0.0/0
    severity: critical
    match:
      provider: aws
      type: aws:ec2:security-group
      where:
        - path: "IpPermissions.#.IpRanges.#.CidrIp"
          op: contains
          value: "0.0.0.0/0"
        - path: "IpPermissions.#.FromPort"
          op: eq
          value: 3389
