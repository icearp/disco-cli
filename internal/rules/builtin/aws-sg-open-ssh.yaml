version: 1
rules:
  - id: aws-sg-open-ssh
    description: Security group allows SSH (port 22) from 0.0.0.0/0
    severity: critical
    match:
      provider: aws
      type: aws:ec2:security-group
      where:
        # Caveat: predicates fan out independently, so this flags SGs that
        # have *some* rule opening 0.0.0.0/0 and *some* rule on port 22 —
        # usually the same rule in practice.
        - path: "IpPermissions.#.IpRanges.#.CidrIp"
          op: contains
          value: "0.0.0.0/0"
        - path: "IpPermissions.#.FromPort"
          op: eq
          value: 22
