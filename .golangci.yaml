version: "2"
linters:
  enable:
    - dupword
    - gocritic
    - gocyclo
    - misspell
    - revive
    - tagliatelle
    - unconvert
    - whitespace
  settings:
    gocyclo:
      min-complexity: 30
    govet:
      disable:
        - loopclosure
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
    tagliatelle:
      case:
        rules:
          dynamodbav: camel
          json: camel
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Provider scanner/resolver structs use PascalCase JSON tags to match SDK marshal output.
      - path: internal/providers/.*\.go
        linters: [tagliatelle]
      # disco JSON contracts use snake_case: store rows, snapshot manifest, Rego input,
      # `disco list/summary/coverage -o json` output, persisted policy findings.
      - path: cmd/(summary|coverage)\.go
        linters: [tagliatelle]
      - path: internal/(coverage|policy|snapshot|store)/.*\.go
        linters: [tagliatelle]
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$