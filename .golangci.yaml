version: "2"
linters:
  enable:
    - dupword
    - gocritic
    - gocyclo
    - misspell
    - paralleltest
    - revive
    - tagliatelle
    - unconvert
    - whitespace
  settings:
    misspell:
      # HDInsight is an Azure product name (SDK import path + type names);
      # misspell otherwise "corrects" it to "hindsight".
      ignore-rules:
        - hdinsight
    gocyclo:
      min-complexity: 30
    paralleltest:
      # Subtests stay serial unless a test is slow enough to repay the edit.
      ignore-missing-subtests: true
    govet:
      disable:
        - loopclosure
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
    tagliatelle:
      case:
        rules:
          json: camel
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Provider scanner/resolver structs use PascalCase JSON tags to match SDK
      # marshal output. This is the only tagliatelle exception: every other JSON
      # surface (store rows, CLI -o json envelopes, snapshot manifest, Rego input,
      # policy findings) is camelCase as of the v0.18.0 wire migration.
      - path: internal/providers/.*\.go
        linters: [tagliatelle]
      # Test funcs walk fixture branches linearly; gocyclo counts every fixture
      # path as branch complexity. Production logic, not test shape, is what
      # the bar is set against.
      - path: _test\.go$
        linters: [gocyclo]
      # paralleltest is scoped to the aws package's own test files (not its
      # subpackages); widen this path for any package whose tests adopt
      # t.Parallel. The guard fires only where golangci-lint runs (make lint),
      # so check that CI runs it before relying on it.
      - path-except: ^internal/providers/aws/[^/]+_test\.go$
        linters: [paralleltest]
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$